<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROZEN (демо)</title>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="site.css?v=6">
</head>
<body class="site">
<header class="top">
  <div class="in">
    <div class="brand"><span id="brand"></span><span class="demo" id="demo"></span></div>
    <nav id="nav"></nav>
    <button id="lang" type="button"></button>
  </div>
</header>
<main id="app"><p>Завантажуємо…</p></main>
<footer id="foot"></footer>

<script src="shared.js?v=7"></script>
<script>

const T = {
  uk: { demo:'Демо: це не офіційний сайт салону', other:'Русский', hours:'Щодня', team:'Наші майстри', place:'Де ми', phoneLabel:'Телефон', addressLabel:'Адреса', map:'Відкрити на карті', writeTg:'Написати в Telegram', reviews:'Відгуки', social:'Ми в соцмережах', noLink:'посилання ще не додано', photos:'Фото ілюстративні: Unsplash', services:'Послуги', min:'хв', cur:'грн',
    book:'Записатися', next:'Далі', back:'Назад', confirm:'Підтвердити запис', done:'Ви записані', cancel:'Скасувати запис', cancelled:'Запис скасовано',
    empty:'Вільного часу немає, оберіть інший день', taken:'Цей час уже зайнятий, оберіть інший', error:'Не вдалося. Спробуйте ще раз',
    service:'Оберіть послугу', master:'Оберіть майстра', time:'Оберіть день і час', contact:'Ваші дані', name:"Ім'я", phone:'Телефон', fill:"Вкажіть ім'я та телефон (щонайменше 9 цифр)",
    link:'Збережіть посилання, щоб скасувати запис:', home:'На головну', notFound:'Запис не знайдено' },
  ru: { demo:'Демо: это не официальный сайт салона', other:'Українська', hours:'Ежедневно', team:'Наши мастера', place:'Где мы', phoneLabel:'Телефон', addressLabel:'Адрес', map:'Открыть на карте', writeTg:'Написать в Telegram', reviews:'Отзывы', social:'Мы в соцсетях', noLink:'ссылка ещё не добавлена', photos:'Фото иллюстративные: Unsplash', services:'Услуги', min:'мин', cur:'грн',
    book:'Записаться', next:'Далее', back:'Назад', confirm:'Подтвердить запись', done:'Вы записаны', cancel:'Отменить запись', cancelled:'Запись отменена',
    empty:'Свободного времени нет, выберите другой день', taken:'Это время уже занято, выберите другое', error:'Не получилось. Попробуйте ещё раз',
    service:'Выберите услугу', master:'Выберите мастера', time:'Выберите день и время', contact:'Ваши данные', name:'Имя', phone:'Телефон', fill:'Укажите имя и телефон (не меньше 9 цифр)',
    link:'Сохраните ссылку, чтобы отменить запись:', home:'На главную', notFound:'Запись не найдена' }
};

let lang = 'uk';
try { if (localStorage.getItem('lang') === 'ru') lang = 'ru'; } catch (e) {}
let screen = 'home', error = '', draft = {}, lastId = '';

const t = k => T[lang][k];
const app = document.getElementById('app');
// Демо: записи зберігаються лише в цьому браузері
const load = () => JSON.parse(localStorage.getItem('bookings-grozen') || '[]');
const save = list => localStorage.setItem('bookings-grozen', JSON.stringify(list));
const service = id => DB.services.find(s => s.id === id);
const master = id => DB.masters.find(m => m.id === id);
const pad = n => String(n).padStart(2, '0');
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayLabel = key => new Date(key + 'T00:00').toLocaleDateString(lang === 'uk' ? 'uk-UA' : 'ru-RU', { weekday:'short', day:'numeric', month:'short' });

function slots(date) {
  const dur = service(draft.service).min, now = new Date(), result = [];
  const busy = load().filter(b => b.master === draft.master && b.date === date && b.status === 'booked');
  for (let m = SALON.open * 60; m + dur <= SALON.close * 60; m += 30) {
    if (date === dayKey(now) && m <= now.getHours() * 60 + now.getMinutes()) continue;
    if (busy.some(b => m < b.start + b.min && b.start < m + dur)) continue;
    result.push(m);
  }
  return result;
}

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(Boolean));
  return node;
}
const button = (text, onclick, cls = '') => el('button', { type:'button', textContent:text, onclick, className:cls });
const go = name => { screen = name; error = ''; render(); window.scrollTo(0, 0); };
const option = (left, right, selected, onclick) => {
  const b = el('button', { type:'button', className:'option', onclick }, el('span', { textContent:left }), el('span', { textContent:right }));
  b.setAttribute('aria-pressed', selected);
  return b;
};
const price = s => s.price ? `${s.price} ${t('cur')} · ${s.min} ${t('min')}` : (lang === 'uk' ? 'ціну уточнюйте' : 'цену уточняйте');
const summary = b => el('div', { className:'card' },
  el('p', { textContent:`${service(b.service)[lang]} · ${price(service(b.service))}` }),
  el('p', { textContent:master(b.master)[lang] }),
  el('p', { textContent:`${dayLabel(b.date)}, ${hhmm(b.start)}` }));

const screens = {
  home: () => {
    const info = DB.info, address = info['address_' + lang];
    const digits = info.phone.replace(/[^\d+]/g, ''), tg = info.telegram.replace(/^.*t\.me\/|@/g, '').replace(/\W/g, '');
    const link = (textContent, href) => el('a', { textContent, href, target:'_blank', rel:'noopener' });
    const h = (tag, textContent) => el(tag, { textContent });
    const book = () => button(t('book'), startBooking, 'primary');
    const fact = (label, value) => el('div', {}, h('dt', label), el('dd', {}, value));
    const social = DB.social.on ? DB.social.items.map(s => {
      const url = s.url.trim();
      // всё без http(s) получает https://, чтобы нельзя было вставить javascript:
      return url ? link(s.name, /^https?:\/\//i.test(url) ? url : 'https://' + url) : el('span', { textContent:`${s.name}: ${t('noLink')}` });
    }) : [];
    return [
      el('div', { className:'hero' },
        photo(DB.photos.hero, PHOTOS.hero, 1920, '', 'eager'),
        el('div', {},
          h('h1', info['name_' + lang]),
          h('p', info['about_' + lang]),
          el('p', { className:'meta', textContent:`${address} · ${t('hours')} ${SALON.open}:00–${SALON.close}:00` }))),
      el('section', { id:'services', className:'split' },
        photo(DB.photos.tools, PHOTOS.tools, 900, 'shot'),
        el('div', {}, h('h2', t('services')),
          el('ul', { className:'menu' }, ...SERVICES.map(s => el('li', {},
            el('button', { type:'button', onclick:() => { draft = { service:s.id }; go('service'); } },
              el('span', { className:'line' },
                el('span', { className:'name', textContent:s[lang] }),
                el('span', { className:'dots' }),
                el('span', { className:'cost', textContent:s.price ? `${s.price} ${t('cur')}` : (lang === 'uk' ? 'уточнюйте' : 'уточняйте') })),
              el('span', { className:'dur', textContent:s.price ? `${s.min} ${t('min')}` : '' }))))),
          book())),
      el('section', { id:'team' }, h('h2', t('team')),
        el('div', { className:'masters' }, ...MASTERS.map((m, i) => el('figure', {},
          photo(m.photo, PHOTOS.masters[i % PHOTOS.masters.length], 700),
          el('figcaption', {}, h('h3', m[lang]), h('p', m['about_' + lang] || '')))))),
      DB.reviews.on && DB.reviews.items.length &&
        el('section', { id:'reviews', className:'quotes' }, h('h2', t('reviews')),
          el('div', { className:'list' }, ...DB.reviews.items.map(r => el('blockquote', {}, h('p', r.text), h('cite', r.author))))),
      el('section', { id:'place', className:'split' },
        el('div', {}, h('h2', t('place')),
          el('dl', { className:'facts' },
            fact(t('addressLabel'), address),
            fact(t('hours'), `${SALON.open}:00–${SALON.close}:00`),
            // номер-заглушка с XX не превращается в ссылку
            fact(t('phoneLabel'), digits.replace('+', '').length >= 9 ? el('a', { textContent:info.phone, href:'tel:' + digits }) : info.phone)),
          el('div', { className:'links' },
            link(t('map'), 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address)),
            tg && link(t('writeTg'), 'https://t.me/' + tg)),
          social.length && h('h3', t('social')),
          social.length && el('div', { className:'links' }, ...social)),
        photo(DB.photos.chair, PHOTOS.chair, 900, 'shot'))
    ].filter(Boolean);
  },
  service: () => [
    el('h2', { textContent:t('service') }),
    ...SERVICES.map(s => option(s[lang], price(s), draft.service === s.id, () => { draft.service = s.id; delete draft.start; render(); })),
    draft.service && button(t('next'), () => {
      if (MASTERS.length === 1) { draft.master = MASTERS[0].id; go('time'); } else go('master');
    }, 'primary'),
    button(t('back'), () => go('home'), 'ghost')
  ],
  master: () => [
    el('h2', { textContent:t('master') }),
    ...MASTERS.map(m => option(m[lang], '', draft.master === m.id, () => { draft.master = m.id; delete draft.start; render(); })),
    draft.master && button(t('next'), () => go('time'), 'primary'),
    button(t('back'), () => go('service'), 'ghost')
  ],
  time: () => {
    const days = Array.from({ length:SALON.daysAhead }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return dayKey(d); });
    draft.date = draft.date || days[0];
    const select = el('select', { onchange: e => { draft.date = e.target.value; delete draft.start; error = ''; render(); } },
      ...days.map(d => el('option', { value:d, textContent:dayLabel(d), selected:d === draft.date })));
    select.style.cssText = 'width:100%;padding:12px;border-radius:12px;background:var(--card);color:var(--text);font:inherit;margin-bottom:12px';
    const free = slots(draft.date);
    return [
      el('h2', { textContent:t('time') }), select,
      free.length
        ? el('div', { className:'grid' }, ...free.map(m => {
            const b = button(hhmm(m), () => { draft.start = m; error = ''; render(); });
            b.setAttribute('aria-pressed', draft.start === m);
            return b;
          }))
        : el('p', { textContent:t('empty') }),
      free.includes(draft.start) && button(t('next'), () => go('contact'), 'primary'),
      button(t('back'), () => go(MASTERS.length === 1 ? 'service' : 'master'), 'ghost')
    ];
  },
  contact: () => {
    return [
      el('h2', { textContent:lang === 'uk' ? 'Це макет' : 'Это макет' }),
      el('p', { textContent:lang === 'uk' ? 'Це тимчасово: онлайн-запис ще не підключено, тому запис не створено. Щоб записатися, зателефонуйте в салон:' : 'Это временно: онлайн-запись ещё не подключена, поэтому запись не создана. Чтобы записаться, позвоните в салон:' }),
      el('p', {}, el('a', { textContent:DB.info.phone, href:'tel:' + DB.info.phone.replace(/\s/g, '') })),
      button(t('back'), () => go('time'), 'ghost')
    ];
    const field = (key, type) => el('label', { textContent:t(key) },
      el('input', { type, value:draft[key] || '', autocomplete:type === 'tel' ? 'tel' : 'name', maxLength:60, oninput:e => draft[key] = e.target.value }));
    return [
      el('h2', { textContent:t('contact') }),
      summary(draft), field('name', 'text'), field('phone', 'tel'),
      button(t('confirm'), confirmBooking, 'primary'),
      button(t('back'), () => go('time'), 'ghost')
    ];
  },
  done: () => {
    const b = load().find(x => x.id === lastId);
    const url = location.href.split('#')[0] + '#cancel=' + b.id;
    return [
      el('h1', { textContent:t('done') }), summary(b),
      el('p', { textContent:t('link') }), el('a', { href:url, textContent:url }),
      button(t('home'), () => go('home'), 'ghost')
    ];
  },
  cancel: () => {
    const b = load().find(x => x.id === lastId);
    const home = button(t('home'), () => { history.replaceState(null, '', location.pathname); go('home'); }, 'ghost');
    if (!b) return [ el('h2', { textContent:t('notFound') }), home ];
    if (b.status === 'cancelled') return [ el('h2', { textContent:t('cancelled') }), summary(b), home ];
    return [
      el('h2', { textContent:t('cancel') }), summary(b),
      button(t('cancel'), () => {
        try { save(load().map(x => x.id === b.id ? { ...x, status:'cancelled' } : x)); error = ''; }
        catch (e) { error = 'error'; }
        render();
      }, 'primary'),
      home
    ];
  }
};

function confirmBooking() {
  const name = (draft.name || '').trim(), phone = (draft.phone || '').trim();
  if (!name || phone.replace(/\D/g, '').length < 9) { error = 'fill'; return render(); }
  try {
    if (!slots(draft.date).includes(draft.start)) { delete draft.start; screen = 'time'; error = 'taken'; return render(); }
    lastId = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    save([...load(), { id:lastId, service:draft.service, master:draft.master, date:draft.date, start:draft.start,
      min:service(draft.service).min, name, phone, status:'booked' }]);
    draft = {};
    go('done');
  } catch (e) { error = 'error'; render(); }
}

const photo = (own, stock, width, className = '', loading = 'lazy') =>
  el('img', { loading, className, alt:'', src:own || stockUrl(stock, width) });
const startBooking = () => { draft = {}; go('service'); };
function scrollToSection(id) {
  if (screen !== 'home') { history.replaceState(null, '', location.pathname); go('home'); }
  document.getElementById(id)?.scrollIntoView();
}
function renderChrome() {
  const items = [['services', 'services'], ['team', 'team'],
    DB.reviews.on && DB.reviews.items.length && ['reviews', 'reviews'], ['place', 'place']].filter(Boolean);
  document.getElementById('brand').textContent = DB.info['name_' + lang];
  document.getElementById('nav').replaceChildren(...items.map(([id, key]) => button(t(key), () => scrollToSection(id))));
  document.getElementById('foot').replaceChildren(
    el('strong', { textContent:DB.info['name_' + lang] }),
    el('p', { textContent:`${DB.info['address_' + lang]} · ${DB.info.phone}` }),
    el('p', { textContent:lang === 'uk' ? 'Макет від vwebstudio для власника салону. Онлайн-запис не працює.' : 'Макет от vwebstudio для владельца салона. Онлайн-запись не работает.' }),
    // подпись про Unsplash нужна, только пока хоть одно фото стоковое
    ...(Object.values(DB.photos).every(Boolean) && MASTERS.every(m => m.photo) ? [] : [el('p', { textContent:t('photos') })]));
  app.className = screen === 'home' ? '' : 'narrow';
}

function render() {
  renderChrome();
  document.documentElement.lang = lang;
  document.getElementById('demo').textContent = t('demo');
  document.getElementById('lang').textContent = t('other');
  try {
    app.replaceChildren(...screens[screen]().filter(Boolean));
  } catch (e) {
    app.replaceChildren(el('p', { textContent:t('error') }));
  }
  if (error) app.append(el('p', { className:'error', textContent:t(error), role:'alert' }));
}

function route() {
  const match = location.hash.match(/^#cancel=(\w+)$/);
  if (match) { lastId = match[1]; screen = 'cancel'; }
  error = '';
  render();
}

document.getElementById('lang').onclick = () => {
  lang = lang === 'uk' ? 'ru' : 'uk';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
};
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
