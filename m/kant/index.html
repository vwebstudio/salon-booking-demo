<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KANT (демо)</title>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0E1512; --panel:#17211C; --line:#2C3A32; --muted:#A7B5AB; --accent:#CFAE6E; --text:#F3F0EA; --display:'Alumni Sans','Oswald',sans-serif; --pad:clamp(20px,5vw,72px); }
* { box-sizing:border-box; margin:0; }
html { scroll-behavior:smooth; scrollbar-color:var(--line) var(--bg); }
body { background:var(--bg); color:var(--text); font:16px/1.55 Inter,system-ui,sans-serif; padding-bottom:76px; }
::selection { background:var(--accent); color:var(--bg); }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
a { color:inherit; }
h1, h2, h3 { font-family:var(--display); text-transform:uppercase; line-height:.94; text-wrap:balance; }
h2 { font-size:clamp(46px,7vw,84px); font-weight:800; margin-bottom:28px; }
h3 { font-size:26px; font-weight:600; letter-spacing:.06em; color:var(--accent); margin:34px 0 4px; }
section { padding:64px var(--pad) 0; scroll-margin-top:72px; }
header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:20px; padding:10px var(--pad); background:var(--bg); border-bottom:1px solid var(--line); }
.brand { margin-right:auto; font:800 28px/1 var(--display); text-transform:uppercase; }
.brand small { display:block; font:400 11px/1.5 Inter,system-ui,sans-serif; text-transform:none; color:var(--muted); }
nav { display:none; gap:24px; font-size:14px; }
nav a { text-decoration:none; }
nav a:hover { color:var(--accent); }
button { font:inherit; font-size:14px; background:none; color:inherit; border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; }
.hero { position:relative; isolation:isolate; display:flex; flex-direction:column; justify-content:flex-end; min-height:76svh; padding:48px var(--pad) 36px; overflow:hidden; }
.hero img { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; animation:settle 1.8s cubic-bezier(.16,1,.3,1) both; }
.hero::after { content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(0deg,var(--bg) 4%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.45)); }
h1 { font-size:clamp(72px,17vw,200px); font-weight:800; overflow-wrap:anywhere; }
.lead { font-size:18px; margin-top:14px; max-width:34em; }
.chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; font-size:14px; }
.chip { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border:1px solid rgba(255,255,255,.28); border-radius:99px; background:rgba(0,0,0,.45); text-decoration:none; }
.dot { width:8px; height:8px; border-radius:50%; background:#5BD16F; }
.dot.closed { background:#E0675A; }
.star { color:var(--accent); }
@keyframes settle { from { transform:scale(1.09); } to { transform:scale(1); } }
.prices { max-width:760px; }
.row { display:grid; grid-template-columns:1fr auto; column-gap:20px; padding:16px 0; border-bottom:1px solid var(--line); }
.row .name { font-size:17px; font-weight:600; }
.row .time { grid-column:1; font-size:13px; color:var(--muted); }
.row .price { grid-column:2; grid-row:1 / span 2; align-self:center; font:800 30px/1 var(--display); white-space:nowrap; font-variant-numeric:tabular-nums; }
.cta { display:block; max-width:420px; margin-top:32px; padding:18px 28px; text-align:center; background:var(--accent); color:var(--bg); font:800 28px/1 var(--display); text-transform:uppercase; letter-spacing:.04em; text-decoration:none; border-radius:4px; }
.cta:hover { filter:brightness(1.1); }
.strip { display:grid; grid-auto-flow:column; grid-auto-columns:78%; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:64px var(--pad) 0; }
.strip img { width:100%; aspect-ratio:4/5; object-fit:cover; scroll-snap-align:center; border-radius:4px; background:var(--panel); }
.visit { display:grid; gap:32px; }
dl div { padding:16px 0; border-bottom:1px solid var(--line); }
dt { font-size:13px; color:var(--muted); }
dd { font:600 32px/1.15 var(--display); margin-top:4px; }
iframe { width:100%; min-height:320px; border:0; border-radius:4px; background:var(--panel); filter:grayscale(1) contrast(1.1); }
footer { margin-top:72px; padding:36px var(--pad); border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
footer strong { display:block; color:var(--text); font:800 clamp(44px,10vw,110px)/1 var(--display); text-transform:uppercase; margin-bottom:14px; overflow-wrap:anywhere; }
.bar { position:fixed; z-index:4; left:0; right:0; bottom:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
.bar a { padding:13px; text-align:center; font-weight:600; text-decoration:none; border:1px solid var(--line); border-radius:4px; }
.bar a:first-child { border-color:var(--accent); color:var(--accent); }
@media (min-width:860px) {
  body { padding-bottom:0; }
  nav { display:flex; }
  .bar { display:none; }
  section { padding-top:120px; }
  .hero { min-height:calc(100svh - 70px); padding-bottom:64px; }
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:72px; align-items:start; }
  .split > h2 { position:sticky; top:100px; }
  .strip { grid-auto-flow:row; grid-template-columns:repeat(3,minmax(0,1fr)); overflow:visible; padding-top:120px; }
  .visit { grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:72px; }
  iframe { height:100%; min-height:460px; }
}
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .hero img { animation:none; } }
</style>
</head>
<body>
<div id="app">Завантажуємо…</div>
<script>
const S = {"name": "KANT", "address": "вулиця Княжий Затон, 9, Київ", "phone": "066 334 0726", "open": null, "close": 21, "rating": "4,9", "count": 55, "booking": "https://n1244844.alteg.io/", "instagram": "", "lead": {"uk": "Барбершоп на Позняках: стрижки, борода й королівське гоління.", "ru": "Барбершоп на Позняках: стрижки, борода и королевское бритьё."}, "photos": ["photo-1599351431202-1e0f0137899a", "photo-1621605815971-fbc98d665033", "photo-1517832606299-7ae9b720a186", "photo-1621645582931-d1d3e6564943"], "groups": [{"name": {"uk": "Стрижки", "ru": "Стрижки"}, "items": [["Чоловіча стрижка", "Мужская стрижка", 950, 60], ["Подовжена чоловіча стрижка", "Удлинённая мужская стрижка", 1000, 60], ["Стрижка під насадку (до 10 мм)", "Стрижка под насадку (до 10 мм)", 800, 30], ["Гоління голови «під 0»", "Бритьё головы «под 0»", 600, 30], ["Корекція стрижки", "Коррекция стрижки", 550, 30]]}, {"name": {"uk": "Борода та гоління", "ru": "Борода и бритьё"}, "items": [["Стрижка бороди", "Стрижка бороды", 500, 30], ["Королівське гоління", "Королевское бритьё", 500, 30], ["Корекція вусів", "Коррекция усов", 250, 15]]}, {"name": {"uk": "Комплекси", "ru": "Комплексы"}, "items": [["Стрижка та борода", "Стрижка и борода", 1300, 90], ["Подовжена стрижка та борода", "Удлинённая стрижка и борода", 1400, 105], ["Стрижка під насадку та борода", "Стрижка под насадку и борода", 1200, 60]]}, {"name": {"uk": "Догляд і колір", "ru": "Уход и цвет"}, "items": [["Камуфлювання сивини, голова", "Камуфлирование седины, голова", 700, 30], ["Камуфлювання сивини, борода", "Камуфлирование седины, борода", 600, 30], ["Укладка та миття волосся", "Укладка и мытьё волос", 350, 15], ["Видалення волосся воском", "Удаление волос воском", 200, 10]]}]};
const T = {
  uk: { other:'Рус', demo:'Демо: це не офіційний сайт салону', prices:'Ціни', visit:'Де і коли', book:'Записатися', bookTel:'Записатися телефоном', call:'Подзвонити', route:'Маршрут', open:'Відчинено до', closed:'Зараз зачинено', daily:'Щодня', until:'до', reviews:'відгуків у Google', address:'Адреса', hours:'Графік', phone:'Телефон', min:'хв', cur:'грн', ask:'уточнюйте',
        note:'Макет від vwebstudio для власника салону. Фото ілюстративні: Unsplash. Графік і ціни перевірте в салоні.' },
  ru: { other:'Укр', demo:'Демо: это не официальный сайт салона', prices:'Цены', visit:'Где и когда', book:'Записаться', bookTel:'Записаться по телефону', call:'Позвонить', route:'Маршрут', open:'Открыто до', closed:'Сейчас закрыто', daily:'Ежедневно', until:'до', reviews:'отзывов в Google', address:'Адрес', hours:'График', phone:'Телефон', min:'мин', cur:'грн', ask:'уточняйте',
        note:'Макет от vwebstudio для владельца салона. Фото иллюстративные: Unsplash. График и цены проверьте в салоне.' }
};
let lang = 'uk';
const t = k => T[lang][k];
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter(Boolean)); return n; };
const txt = (tag, textContent, className = '') => el(tag, { textContent, className });
const out = (textContent, href, className = '') => el('a', { textContent, href, className, target:'_blank', rel:'noopener' });
const img = (id, w, lazy = true) => el('img', { src:`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=75`, alt:'', loading:lazy ? 'lazy' : 'eager' });
const tel = 'tel:+38' + S.phone.replace(/\D/g, '');
const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(S.name + ' ' + S.address);
const hh = h => h + ':00';

// статус по киевскому времени; если час открытия неизвестен, статус не показываем
function status() {
  if (S.open === null) return null;
  const h = Number(new Intl.DateTimeFormat('en-GB', { hour:'numeric', hour12:false, timeZone:'Europe/Kyiv' }).format(new Date()));
  const isOpen = h >= S.open && h < S.close;
  return el('span', { className:'chip' }, el('span', { className:isOpen ? 'dot' : 'dot closed' }), isOpen ? `${t('open')} ${hh(S.close)}` : t('closed'));
}

function render() {
  document.documentElement.lang = lang;
  const hours = S.open === null ? `${t('daily')} ${t('until')} ${hh(S.close)}` : `${t('daily')} ${hh(S.open)}–${hh(S.close)}`;
  const toggle = el('button', { type:'button', textContent:t('other'), onclick:() => { lang = lang === 'uk' ? 'ru' : 'uk'; render(); } });
  const fact = (label, value) => el('div', {}, txt('dt', label), el('dd', {}, value));
  document.getElementById('app').replaceChildren(
    el('header', {},
      el('div', { className:'brand' }, S.name, txt('small', t('demo'))),
      el('nav', {}, el('a', { href:'#prices', textContent:t('prices') }), el('a', { href:'#visit', textContent:t('visit') }), el('a', { href:tel, textContent:S.phone })),
      toggle),
    el('main', {},
      el('div', { className:'hero' },
        img(S.photos[0], 1920, false),
        txt('h1', S.name),
        txt('p', S.lead[lang], 'lead'),
        el('div', { className:'chips' }, status(),
          out('', maps, 'chip'),
          txt('span', hours, 'chip'))),
      el('section', { id:'prices', className:'split' },
        txt('h2', t('prices')),
        el('div', { className:'prices' },
          ...S.groups.flatMap(g => [g.name && txt('h3', g.name[lang]),
            ...g.items.map(([uk, ru, price, min]) => el('div', { className:'row' },
              txt('span', lang === 'uk' ? uk : ru, 'name'),
              txt('span', price === null ? '' : `${min} ${t('min')}`, 'time'),
              txt('span', price === null ? t('ask') : `${price.toLocaleString('uk-UA')} ${t('cur')}`, 'price')))]).filter(Boolean),
          S.booking ? out(t('book'), S.booking, 'cta') : el('a', { className:'cta', href:tel, textContent:t('bookTel') }))),
      el('div', { className:'strip' }, ...S.photos.slice(1).map(id => img(id, 800))),
      el('section', { id:'visit' },
        txt('h2', t('visit')),
        el('div', { className:'visit' },
          el('dl', {}, fact(t('address'), out(S.address, maps)), fact(t('hours'), hours), fact(t('phone'), el('a', { href:tel, textContent:S.phone })),
            S.instagram && fact('Instagram', out('@' + S.instagram, 'https://www.instagram.com/' + S.instagram + '/'))),
          el('iframe', { src:'https://maps.google.com/maps?q=' + encodeURIComponent(S.address) + '&z=16&output=embed', title:t('address'), loading:'lazy' })))),
    el('footer', {}, txt('strong', S.name), txt('p', `${S.address} · ${S.phone}`), txt('p', t('demo') + '. ' + t('note'))),
    el('div', { className:'bar' }, el('a', { href:tel, textContent:t('call') }), out(t('route'), maps)));
  const rating = document.querySelector('.chips a');
  rating.replaceChildren(txt('span', '★', 'star'), `${S.rating} · ${S.count} ${t('reviews')}`);
}
render();
</script>
</body>
</html>
